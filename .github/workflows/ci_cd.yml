name: CI/CD

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY_BACKEND: quick-commerce-backend
  ECR_REPOSITORY_FRONTEND: quick-commerce-frontend
  ECS_CLUSTER: quick-commerce-cluster
  ECS_SERVICE_BACKEND: quick-commerce-backend-service
  ECS_SERVICE_FRONTEND: quick-commerce-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f Dockerfile.backend \
            -t $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest

      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f Dockerfile.frontend \
            -t $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Render and register backend task definition
        run: |
          sed -e "s|__MONGODB_URI__|${{ secrets.MONGODB_URI }}|g" \
              -e "s|__GEMINI_API_KEY__|${{ secrets.GEMINI_API_KEY }}|g" \
              -e "s|__GROQ_API_KEY__|${{ secrets.GROQ_API_KEY }}|g" \
              -e "s|__OPENAI_API_KEY__|${{ secrets.OPENAI_API_KEY }}|g" \
              -e "s|__TAVILY_API_KEY__|${{ secrets.TAVILY_API_KEY }}|g" \
              -e "s|__TWILIO_ACCOUNT_SID__|${{ secrets.TWILIO_ACCOUNT_SID }}|g" \
              -e "s|__TWILIO_AUTH_TOKEN__|${{ secrets.TWILIO_AUTH_TOKEN }}|g" \
              -e "s|__TWILIO_WHATSAPP_NUMBER__|${{ secrets.TWILIO_WHATSAPP_NUMBER }}|g" \
              -e "s|__CLOUDINARY_CLOUD_NAME__|${{ secrets.CLOUDINARY_CLOUD_NAME }}|g" \
              -e "s|__CLOUDINARY_API_KEY__|${{ secrets.CLOUDINARY_API_KEY }}|g" \
              -e "s|__CLOUDINARY_API_SECRET__|${{ secrets.CLOUDINARY_API_SECRET }}|g" \
              -e "s|__ADMIN_WS_TOKEN__|${{ secrets.ADMIN_WS_TOKEN }}|g" \
              -e "s|__CORS_ORIGINS__|${{ secrets.CORS_ORIGINS }}|g" \
              backend-task-def.json > rendered-backend-task-def.json
          aws ecs register-task-definition --cli-input-json file://rendered-backend-task-def.json

      - name: Render and register frontend task definition
        run: |
          sed -e "s|__API_BASE_URL__|${{ secrets.API_BASE_URL }}|g" \
              -e "s|__WS_BASE_URL__|${{ secrets.WS_BASE_URL }}|g" \
              -e "s|__ADMIN_WS_TOKEN__|${{ secrets.ADMIN_WS_TOKEN }}|g" \
              frontend-task-def.json > rendered-frontend-task-def.json
          aws ecs register-task-definition --cli-input-json file://rendered-frontend-task-def.json

      - name: Update backend ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE_BACKEND }} \
            --task-definition quick-commerce-backend \
            --force-new-deployment

      - name: Update frontend ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE_FRONTEND }} \
            --force-new-deployment